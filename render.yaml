services:
  - type: web
    name: edera-backend
    env: python
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: OPENAI_API_KEY
      - key: ANTHROPIC_API_KEY
      - key: EDERA_LOG_LEVEL
      - key: EDERA_MAX_FILE_SIZE_MB
